version: "0.2"
# Implementation plans are code-heavy working documents (GDScript identifiers
# everywhere) and are retired after execution - not worth dictionary noise.
ignorePaths:
  - "docs/superpowers/plans/**"
dictionaryDefinitions:
  - name: custom-dictionary
    path: ./.cspell/custom-dictionary.txt
    addWords: true
    scope: null
dictionaries:
  - custom-dictionary
words:
  - Example
  - gdignore
ignoreWords: []
import: []

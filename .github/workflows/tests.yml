name: tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  gdunit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project (warm cache)
        run: ~/godot/godot --headless --path . --import --quit

      - name: Run GdUnit4 suite
        run: |
          GODOT_BIN=~/godot/godot ~/godot/godot --headless --path . -s -d \
            addons/gdUnit4/bin/GdUnitCmdTool.gd -a ./tests --ignoreHeadlessMode

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-reports
          path: reports/
          if-no-files-found: ignore
